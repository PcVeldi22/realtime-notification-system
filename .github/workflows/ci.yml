name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean compile

      - name: Run unit tests
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: docker build -t realtime-notification-system:${{ github.sha }} .
